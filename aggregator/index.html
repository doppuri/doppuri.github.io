<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>ASMR Aggregator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2342a5f5' d='M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h2v-8H5v-1a7 7 0 0 1 14 0v1h-2v8h2a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <button class="icon-btn" id="menuBtn" title="メニュー"><span class="ms">menu</span></button>
    <a class="logo" href="#/"><span class="ms">headphones</span><span class="logo-text">ASMR<b>Aggregator</b></span></a>
    <form class="search" id="searchForm" autocomplete="off">
      <span class="ms">search</span>
      <input id="searchInput" type="search" placeholder="作品名 / サークル / 声優 / RJ・VJ・BJコード" />
    </form>
    <a class="icon-btn status-btn" href="#/status" title="サーバー状況（開くと確認します）"><span class="ms">dns</span><i id="statusDot" class="dot"></i></a>
    <button class="icon-btn" id="themeBtn" title="テーマ切替"><span class="ms">dark_mode</span></button>
  </header>

  <nav class="drawer" id="drawer">
    <a href="#/" data-nav="home"><span class="ms">library_music</span>新着作品</a>
    <a href="#/ranking" data-nav="ranking"><span class="ms">trending_up</span>ランキング</a>
    <a href="#/?order=rate_average_2dp" data-nav="rated"><span class="ms">star</span>高評価作品</a>
    <a href="#/?order=random" data-nav="random"><span class="ms">shuffle</span>ランダム</a>
    <hr />
    <a href="#/queue" data-nav="queue"><span class="ms">queue_music</span>再生キュー</a>
    <a href="#/history" data-nav="history"><span class="ms">history</span>再生履歴</a>
    <hr />
    <a href="#/status" data-nav="status"><span class="ms">monitor_heart</span>サーバー状況・設定</a>
    <div class="drawer-foot">音声は各配信元から直接ストリーミング再生されます（本サイトは保存しません）。</div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="app"></main>

  <!-- ミニプレイヤー -->
  <div class="mini" id="mini" hidden>
    <div class="mini-progress"><i id="miniBar"></i></div>
    <img id="miniCover" alt="" />
    <div class="mini-text" id="miniOpen">
      <div class="mini-title" id="miniTitle"></div>
      <div class="mini-sub" id="miniSub"></div>
    </div>
    <button class="icon-btn" data-act="prev" title="前へ"><span class="ms">skip_previous</span></button>
    <button class="icon-btn big" data-act="toggle" title="再生/一時停止"><span class="ms fill" id="miniPlayIcon">play_arrow</span></button>
    <button class="icon-btn" data-act="next" title="次へ"><span class="ms">skip_next</span></button>
    <button class="icon-btn hide-sm" id="miniExpand" title="プレイヤーを開く"><span class="ms">expand_less</span></button>
  </div>

  <!-- フルプレイヤー -->
  <section class="player" id="player" hidden>
    <div class="player-head">
      <button class="icon-btn" id="playerClose" title="閉じる"><span class="ms">expand_more</span></button>
      <div class="player-head-title">再生中</div>
      <button class="icon-btn" id="playerQueueBtn" title="キュー"><span class="ms">queue_music</span></button>
    </div>
    <div class="player-body">
      <div class="player-main">
        <img class="player-cover" id="pCover" alt="" />
        <div class="player-title" id="pTitle"></div>
        <a class="player-work" id="pWork"></a>
        <div class="player-meta" id="pMeta"></div>
        <div class="seek">
          <input type="range" id="pSeek" min="0" max="1000" value="0" />
          <div class="times"><span id="pCur">0:00</span><span class="buf" id="pBuf"></span><span id="pDur">0:00</span></div>
        </div>
        <div class="controls">
          <button class="icon-btn" id="pMode" title="リピート"><span class="ms">repeat</span></button>
          <button class="icon-btn" data-act="prev"><span class="ms">skip_previous</span></button>
          <button class="icon-btn" data-act="back"><span class="ms">replay_30</span></button>
          <button class="icon-btn play" data-act="toggle"><span class="ms fill" id="pPlayIcon">play_arrow</span></button>
          <button class="icon-btn" data-act="fwd"><span class="ms">forward_30</span></button>
          <button class="icon-btn" data-act="next"><span class="ms">skip_next</span></button>
          <select id="pRate" title="再生速度">
            <option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option><option value="2">2.0x</option>
          </select>
        </div>
        <div class="volume"><span class="ms">volume_up</span><input type="range" id="pVol" min="0" max="1" step="0.01" value="1" /></div>
        <div class="sleep">
          <span class="ms">bedtime</span>
          <select id="pSleep" title="スリープタイマー">
            <option value="0">スリープタイマー: オフ</option><option value="15">15分後に停止</option><option value="30">30分後に停止</option>
            <option value="60">60分後に停止</option><option value="90">90分後に停止</option><option value="track">このトラックの終わりで停止</option>
          </select>
        </div>
      </div>
      <div class="player-queue" id="pQueue"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="" /></div>
  <div class="toasts" id="toasts"></div>
  <audio id="audio" preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
